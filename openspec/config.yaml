# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Next.js 16.1.6, React 19.2.3, TypeScript 5 (strict), pnpm workspaces
  Architecture: Feature-based (src/features/*), core (src/core/*), shared components
  Database: Drizzle ORM (PostgreSQL), Supabase auth + SSR
  UI: Material Design 3 (@material/web 2.4), custom MaterialClient wrapper
  CI: GitHub Actions (quality, build, commitlint, test)
  Quality: ESLint 9 (typescript-eslint strict, unicorn, sonarjs), Prettier 3.8,
           commitlint conventional, Husky pre-commit lint-staged
  Conventions: Strict TS, PascalCase interfaces/types, camelCase functions,
               `@/` alias for src/, `@app/` alias for app/

testing:
  strict_tdd: true
  runner: vitest
  runner_version: 4.1.8
  layers:
    unit:
      command: pnpm test:unit
      framework: vitest + @testing-library/react + jsdom
    e2e:
      command: pnpm test:e2e
      framework: Playwright 1.59 (chromium only)
  coverage:
    available: true
    command: vitest --coverage (via vitest built-in)
  quality_tools:
    linter: eslint (pnpm lint)
    type_checker: tsc (pnpm type-check)
    formatter: prettier (pnpm format)

rules:
  proposal:
    - Include rollback plan for database migrations
    - State which feature/domain is affected
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Reference Drizzle schema paths from src/core/database/
  design:
    - Include sequence diagrams for multi-step flows
    - Document Supabase auth patterns (server vs client)
    - Reference Material Design 3 component decisions
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (feature folders, core separation)
    tdd: true
    test_command: pnpm test:unit
  verify:
    test_command: pnpm test:unit
    build_command: pnpm build
    e2e_command: pnpm test:e2e
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
